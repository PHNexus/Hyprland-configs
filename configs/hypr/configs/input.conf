#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_options = grp:win_space_toggle
    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
    accel_profile = flat
    force_no_accel = true
    
    touchpad {
        natural_scroll = true
    }
}


device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

