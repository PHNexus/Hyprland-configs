general {
    gaps_in = 5
    gaps_out = 10
    border_size = 1
   col.active_border = rgb(bbbbbb)

   col.inactive_border = rgb(666666)
    resize_on_border = true
    allow_tearing = true
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 1
    inactive_opacity = 1

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgb(15161e)
    }

    blur {
        enabled = true
        size = 6
        passes = 4
        vibrancy = 0.1696   
         }
}
