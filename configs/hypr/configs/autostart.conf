
#################
### AUTOSTART ###
#################

xwayland {
  force_zero_scaling = true
}
exec-once = hyprctl dispatch workspace 1
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store # Stores only text data
exec-once = wl-paste --type image --watch cliphist store # Stores only image data
exec-once = systemctl --user start hyprpolkitagent
exec-once = xrandr --output DP-1 --primary
exec-once = nvibrant 0 512 512 0
exec-once = sleep 1 && waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && gnome-keyring-daemon --start --components=secrets
# set a random wallpaper at start and start hyprpaper
#exec-once = awww-daemon & sleep 1; $HOME/.config/hypr/scripts/wallpapers/set-random.sh
exec-once = aww-deamon
#exec-once = waydroid session start
exec-shutdown = killall -u $USER
