$terminal = kitty
$fileManager = thunar
$menu = pgrep -x wofi > /dev/null && pkill -x wofi || wofi --show drun
$clipboard = cliphist list

#MY SCRIPS
# Copilot key → Claude (RIP microslop's button)
# NOTE: code:201 is the Copilot key — only on newer keyboards.
# No Copilot key? Find your keycode with `wev` and swap it in,
# or just change the bind to a normal combo e.g. SUPER, code:201 → SUPER SHIFT, B
bind = SUPER SHIFT, code:201, exec, firefox https://claude.ai

#these 2 make it so side buttons on mouse move workspaces, idk which mouses works but g502 does 
#bind = , mouse:276, workspace, +1 
#bind = , mouse:275, workspace, -1 

$mainMod = SUPER

# Scripts and apps binds

## Exec
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Space, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, C, exec, code
bind = $mainMod, V, exec, $clipboard | wofi --dmenu | cliphist decode | wl-copy
bind = $mainMod, L, exec, hyprlock
# set a random wallpaper
bind = $mainMod, R, exec, $HOME/.config/hypr/scripts/wallpapers/set-random.sh
bind = $mainMod, W, exec, $HOME/.config/hypr/scripts/wallpapers/set-wallpaper.sh



# WM Control binds
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, F, togglefloating,
bind = $mainMod, F, resizeactive, exact 1000 600
# bind = $mainMod, P, pseudo, # dwindle
## Window Switch
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, Tab, workspace, previous
bind = $mainMod ALT, left, workspace, -1
bind = $mainMod ALT, right, workspace, +1


# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, left, movetoworkspace, -1
bind = $mainMod SHIFT, right, movetoworkspace, +1


# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 5%-


# Screenshot a window
#bind = $mainMod SHIFT, x, exec, hyprshot -m window 
# Screenshot a monitor
#bind = , PRINT, exec, hyprshot -m output
# Screenshot a region
bind = $mainMod SHIFT, S, exec, hyprshot -m region -o ~/Pictures/Screenshots -c --notify


