#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24

# Garantir que o cursor seja aplicado na inicialização
exec-once = hyprctl setcursor Bibata-Modern-Ice 24
#flatpak
env = XDG_DATA_DIRS,$HOME/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share

# NVIDIA
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

# Wayland
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = NVD_BACKEND,direct

# NVIDIA Shader Cache
env = __GL_SHADER_DISK_CACHE,1
env = __GL_SHADER_DISK_CACHE_SIZE,10737418240
env = __GL_SYNC_TO_VBLANK,0