format = """
[╭](fg:color_bg3) 🛸 $directory$git_branch$git_status$nodejs${custom.typescript}${custom.svelte}${custom.pnpm}${custom.turbo}${custom.env}$docker_context$python$cmd_duration$time
$character"""

palette = "gruvbox"

[palettes.gruvbox]
color_fg0 = "#ebdbb2"
color_bg3 = "#665c54"
color_blue = "#458588"
color_aqua = "#689d6a"
color_green = "#98971a"
color_orange = "#d65d0e"
color_red = "#cc241d"
color_yellow = "#d79921"
color_purple = "#b16286"

[character]
format = "[╰─](fg:color_bg3)$symbol "
success_symbol = "[❯](fg:color_green)"
error_symbol = "[❯](fg:color_red)"

[directory]
format = "[$path](fg:color_blue)"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:color_yellow"
format = " [${symbol} $branch]($style)"

[git_status]
style = "fg:color_orange"
format = " [$all_status$ahead_behind]($style)"
conflicted = "⚠"
ahead = "⇡"
behind = "⇣"
diverged = "⇕"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = ""
style = "fg:color_green"
format = " [$symbol]($style)"
detect_files = ["package.json", ".nvmrc"]
detect_extensions = []
detect_folders = ["node_modules"]

[custom.typescript]
description = "TypeScript project"
command = "printf ''"
when = "test -f tsconfig.json || test -f tsconfig.app.json || test -f tsconfig.node.json"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:color_blue"
format = " [$output]($style)"

[custom.svelte]
description = "Svelte project"
command = "printf ''"
when = "test -f svelte.config.js || test -f svelte.config.ts"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:color_orange"
format = " [$output]($style)"

[custom.pnpm]
description = "pnpm project"
command = "printf '📦'"
when = "test -f pnpm-lock.yaml"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:color_purple"
format = " [$output]($style)"

[custom.turbo]
description = "Turborepo project"
command = "printf '🌀'"
when = "test -f turbo.json"
shell = ["bash", "--noprofile", "--norc"]
style = "fg:color_aqua"
format = " [$output]($style)"

[custom.env]
command = '''
if [ "$NODE_ENV" = "production" ]; then
  printf "🚀 prod"
elif [ "$NODE_ENV" = "test" ]; then
  printf "🧪 test"
else
  printf "🧪 dev"
fi
'''
when = 'test -n "$NODE_ENV"'
shell = ["bash", "--noprofile", "--norc"]
style = "fg:color_aqua"
format = " [$output]($style)"

[docker_context]
symbol = "🐳"
style = "fg:color_blue"
format = " [$symbol $context]($style)"
only_with_files = false

[python]
symbol = "🐍"
style = "fg:color_yellow"
format = " [$symbol $virtualenv]($style)"
detect_extensions = ["py"]
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "uv.lock"]
detect_folders = [".venv", "venv"]

[cmd_duration]
min_time = 2000
style = "fg:color_orange"
format = " [⏱ $duration]($style)"

[time]
disabled = false
time_format = "%R"
style = "fg:color_fg0"
format = " [$time]($style)"

[package]
disabled = true

[hostname]
disabled = true

[username]
disabled = true