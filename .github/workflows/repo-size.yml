name: Update Repository Size Badge

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-size-badge
  cancel-in-progress: false

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          fetch-tags: false

      - name: Fetch complete main history
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --unshallow origin \
            '+refs/heads/main:refs/remotes/origin/main'

      - name: Calculate total repository size
        shell: bash
        run: |
          set -euo pipefail

          SIZE_BYTES=$(du -sb . | cut -f1)

          SIZE=$(awk -v bytes="$SIZE_BYTES" 'BEGIN {
            if (bytes >= 1073741824)
              printf "%.2f GiB", bytes / 1073741824
            else if (bytes >= 1048576)
              printf "%.2f MiB", bytes / 1048576
            else
              printf "%.2f KiB", bytes / 1024
          }')

          mkdir -p "$RUNNER_TEMP/badge"

          printf '{"schemaVersion":1,"label":"Repository Size","message":"%s","color":"blue","cacheSeconds":300}\n' \
            "$SIZE" > "$RUNNER_TEMP/badge/repo-size.json"

          echo "Repository size: $SIZE ($SIZE_BYTES bytes)"

      - name: Publish badge data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan badges
          git rm -rf .
          cp "$RUNNER_TEMP/badge/repo-size.json" repo-size.json

          git add repo-size.json
          git commit -m "Update repository size badge"
          git push --force origin badges