
name: Update Clone Download Badge

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-download-badge
  cancel-in-progress: false

jobs:
  update-badge:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Measure clone download size
        shell: bash
        run: |
          set -euo pipefail

          CLONE_DIR="$RUNNER_TEMP/clone-size-check"
          CLONE_LOG="$RUNNER_TEMP/clone.log"
          PROGRESS_LOG="$RUNNER_TEMP/clone-progress.log"

          git clone --progress --single-branch --no-tags \
            --branch main \
            "https://github.com/${GITHUB_REPOSITORY}.git" \
            "$CLONE_DIR" 2> "$CLONE_LOG"

          tr '\r' '\n' < "$CLONE_LOG" > "$PROGRESS_LOG"
          cat "$PROGRESS_LOG"

          SIZE=$(sed -nE \
            's/.*Receiving objects: *100% \([0-9]+\/[0-9]+\), ([0-9]+([.][0-9]+)? [KMGT]iB).*/\1/p' \
            "$PROGRESS_LOG" | tail -n 1)

          if [[ -z "$SIZE" ]]; then
            echo "::error::Could not determine Git clone download size."
            cat "$CLONE_LOG"
            exit 1
          fi

          printf '{"schemaVersion":1,"label":"Clone Download","message":"%s","color":"blue"}\n' \
            "$SIZE" > "$RUNNER_TEMP/clone-download.json"

          echo "Clone download size: $SIZE"

      - name: Publish badge data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan badges
          git rm -rf .
          cp "$RUNNER_TEMP/clone-download.json" repo-size.json

          git add repo-size.json
          git commit -m "Update clone download badge"
          git push --force origin badges
